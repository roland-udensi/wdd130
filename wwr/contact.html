<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Splash Rafting</title>
    <meta name="description"
      content="Contact Splash Water Rafting for reservations, questions, trip information, and customer support.">

    <meta name="author" content="Roland Udensi">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-splash.png" alt="White Water Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <!-- 1. Page Heading -->
        <h1>Contact Us</h1>

        <!-- 2. Company Information -->
        <section class="company-info">
            <h2>Splash Rafting</h2>

            <p>191 Ikwerre Road, Mile 3 Rivers State</p>
            <p>Phone: (+234) 9071166315</p>
            <p>Email: info@splashrafting.com</p>
        </section>

        <!-- 3. Contact Area -->
        <section class="contact-content">
            <h2>Contact Splash Rafting</h2>
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d31803.559631387077!2d7.142849300000001!3d4.8648649!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1786169157243!5m2!1sen!2sng"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            <div class="contact-form">

                <form action="#" method="post">

                    <label for="name">Name</label>
                    <input type="text" id="name" name="name">

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">

                    <p>Message Purpose</p>

                    <label>
                        <input type="radio" name="purpose" value="general">
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="website">
                        Website Suggestion
                    </label>

                    <label for="message">Message</label>
                    <textarea id="message" name="message"></textarea>

                    <label>
                        <input type="checkbox" name="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Get in Touch!</button>

                </form>

            </div>

        </section>

        <!-- 4. Employees -->
        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <section class="employees">
                <h2>Meet Our Team</h2>

                <figure>
                    <img src="images/customer.jpg" alt="Rafting employees">
                    <figcaption>John Smith - River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/family-fun.jpg" alt="Rafting employees">
                    <figcaption>Sarah Johnson - Reservations Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/full-adventure.jpg" alt="Rafting employees">
                    <figcaption>Michael Brown - General Manager</figcaption>
                </figure>
            </section>
        </section>

    </main>

    <footer>
        <p>©2026 🌴 Splash Rafting 🌴 Roland Udensi</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn">
            </a>
        </nav>
    </footer>
</body>

</html>
